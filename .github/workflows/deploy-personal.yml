name: Deploy Float personal

on:
  push:
    branches:
      - personal
  workflow_dispatch:

concurrency:
  group: float-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SELF_HOSTED_MODE: "true"

    steps:
      - name: Check out personal branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Float
        run: npm run build

      - name: Assemble release archive
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/float-release"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/float-release"
          cp -a .next "$RUNNER_TEMP/float-release/.next"
          rm -rf "$RUNNER_TEMP/float-release/.next/cache"
          tar -C "$RUNNER_TEMP/float-release" -czf "$RUNNER_TEMP/float-${GITHUB_SHA}.tar.gz" .

      - name: Configure deployment SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.FLOAT_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.FLOAT_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" >"$HOME/.ssh/float_deploy"
          chmod 600 "$HOME/.ssh/float_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload and activate release
        shell: bash
        env:
          FLOAT_HOST: ${{ secrets.FLOAT_HOST }}
          FLOAT_USER: ${{ secrets.FLOAT_USER }}
        run: |
          set -Eeuo pipefail
          SSH_ARGS=(
            -i "$HOME/.ssh/float_deploy"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=8
            -o IPQoS=throughput
          )
          ARCHIVE="float-${GITHUB_SHA}.tar.gz"
          SCRIPT="float-release-${GITHUB_SHA}.sh"
          CHECKSUM="$ARCHIVE.sha256"

          sha256sum "$RUNNER_TEMP/$ARCHIVE" | awk '{print $1}' >"$RUNNER_TEMP/$CHECKSUM"
          split -b 1M -d -a 3 "$RUNNER_TEMP/$ARCHIVE" "$RUNNER_TEMP/$ARCHIVE.part-"

          upload() {
            local source="$1"
            local destination="$2"
            local attempt

            for attempt in 1 2 3; do
              if scp -O "${SSH_ARGS[@]}" "$source" "$FLOAT_USER@$FLOAT_HOST:$destination"; then
                return 0
              fi
              echo "Upload attempt $attempt failed for $(basename "$source")." >&2
              sleep 5
            done
            return 1
          }

          ssh "${SSH_ARGS[@]}" "$FLOAT_USER@$FLOAT_HOST" \
            "rm -f '/tmp/$ARCHIVE' /tmp/'$ARCHIVE'.part-* '/tmp/$CHECKSUM' '/tmp/$SCRIPT'"

          upload deploy/float-release.sh "/tmp/$SCRIPT"
          upload "$RUNNER_TEMP/$CHECKSUM" "/tmp/$CHECKSUM"
          for part in "$RUNNER_TEMP/$ARCHIVE".part-*; do
            upload "$part" "/tmp/$(basename "$part")"
          done

          ssh "${SSH_ARGS[@]}" "$FLOAT_USER@$FLOAT_HOST" \
            "set -e; cat /tmp/'$ARCHIVE'.part-* >'/tmp/$ARCHIVE'; expected=\$(cat '/tmp/$CHECKSUM'); printf '%s  %s\n' \"\$expected\" '/tmp/$ARCHIVE' | sha256sum -c -; rm -f /tmp/'$ARCHIVE'.part-* '/tmp/$CHECKSUM'; chmod 700 '/tmp/$SCRIPT'; '/tmp/$SCRIPT' '/tmp/$ARCHIVE' '$GITHUB_SHA'; rm -f '/tmp/$SCRIPT'"
